<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Castoff</title>
<style>
  :root {
    color-scheme: light dark;
    --fg: #1c1c1e;
    --fg-dim: #555;
    --bg: #fafafa;
    --accent: #c44a3a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #eee; --fg-dim: #999; --bg: #111; --accent: #ff6f5b; }
  }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); }
  body {
    font: 17px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .card {
    max-width: 32rem;
    text-align: center;
  }
  h1 {
    font-size: 2.5rem;
    margin: 0 0 0.5rem;
    letter-spacing: -0.02em;
  }
  .tagline {
    color: var(--fg-dim);
    margin: 0 0 2rem;
    font-size: 1.125rem;
  }
  p { margin: 0 0 1rem; color: var(--fg-dim); }
</style>
</head>
<body>
<main class="card">
  <h1>Castoff</h1>
  <p class="tagline">A podcast player for sequential listening</p>
  <p>Castoff lets you listen to a podcast in chronological order from any starting point — perfect for history shows, narrative series, and any podcast where order matters.</p>
</main>
</body>
</html>
